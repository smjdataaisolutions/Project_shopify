apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smj-shopify-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 8
      timeoutSeconds: 60
      serviceAccountName: smj-shopify-frontend-runner@smj-shopify-analytics.iam.gserviceaccount.com
      containers:
        - image: us-east5-docker.pkg.dev/smj-shopify-analytics/smj-shopify-api/smj-shopify-frontend:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SHOPIFY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: smj-shopify-app-api-secret
                  key: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smj-shopify-session-database-url
                  key: "2"
            - name: TENANT_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smj-shopify-tenant-assertion-secret
                  key: "2"
            - name: SHOPIFY_API_KEY
              value: "38254bd587274d5002c06d0ecab16259"
            - name: SHOPIFY_APP_URL
              value: https://smj-shopify-frontend-876969185947.us-east5.run.app
            - name: SCOPES
              value: read_inventory,read_locations,read_orders,write_products,write_metaobjects,write_metaobject_definitions
            - name: TENANT_ASSERTION_ISSUER
              value: smj-shopify-frontend
            - name: TENANT_ASSERTION_AUDIENCE
              value: smj-shopify-api
            - name: FASTAPI_BASE_URL
              value: https://smj-shopify-api-3douxa5qja-ul.a.run.app
            - name: FASTAPI_AUDIENCE
              value: https://smj-shopify-api-3douxa5qja-ul.a.run.app
            - name: FASTAPI_IAM_AUTH_ENABLED
              value: "true"
            - name: DEPLOYMENT_ENVIRONMENT
              value: staging
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
  traffic:
    - percent: 100
      latestRevision: true
