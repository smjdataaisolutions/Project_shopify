apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smj-shopify-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 8
      timeoutSeconds: 60
      serviceAccountName: smj-shopify-api-runner@smj-shopify-analytics.iam.gserviceaccount.com
      containers:
        - image: us-east5-docker.pkg.dev/smj-shopify-analytics/smj-shopify-api/smj-shopify-api:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smj-shopify-neon-database-url
                  key: "3"
            - name: SHOPIFY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: smj-shopify-app-api-secret
                  key: "5"
            - name: TENANT_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: smj-shopify-tenant-assertion-secret
                  key: "1"
            - name: APP_NAME
              value: SMJ Shopify Analytics API - Staging
            - name: DEPLOYMENT_ENVIRONMENT
              value: staging
            - name: API_DOCS_ENABLED
              value: "false"
            - name: API_AUTH_ENABLED
              value: "true"
            - name: SHOPIFY_API_KEY
              value: "38254bd587274d5002c06d0ecab16259"
            - name: TENANT_ASSERTION_ISSUER
              value: smj-shopify-frontend
            - name: TENANT_ASSERTION_AUDIENCE
              value: smj-shopify-api
            - name: DATABASE_POOL_SIZE
              value: "2"
            - name: DATABASE_MAX_OVERFLOW
              value: "2"
            - name: DATABASE_POOL_TIMEOUT_SECONDS
              value: "10"
            - name: DATABASE_POOL_RECYCLE_SECONDS
              value: "300"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
  traffic:
    - percent: 100
      latestRevision: true
